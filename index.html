<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio · Planificador CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#111c29">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Planificador">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: none;">

    <button id="menu-toggle" aria-label="Abrir menú de navegación">
        <svg class="icon icon--lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav id="main-nav" aria-label="Navegación principal"></nav>

    <main class="content-wrapper">
        <div class="page-inner">

            <header class="page-header">
                <div>
                    <h1 class="page-header__title" id="saludo">Inicio</h1>
                    <p class="page-header__sub" id="fecha-hoy"></p>
                </div>
                <div class="page-header__actions">
                    <a href="sesion.html" class="btn btn--primary">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
                        Registrar estudio
                    </a>
                </div>
            </header>

            <section id="panel-objetivos" class="objetivos-panel hidden">
                <div id="cuenta-atras" class="countdown hidden">
                    <span class="countdown__num" id="countdown-dias">—</span>
                    <span class="countdown__body">
                        <span class="countdown__label">para la convocatoria</span>
                        <span class="countdown__fecha" id="countdown-fecha"></span>
                    </span>
                </div>

                <div id="meta-semanal" class="goal hidden">
                    <div class="goal__head">
                        <span class="goal__label">Objetivo semanal</span>
                        <span class="goal__cifra"><b id="goal-hecho">—</b> <span id="goal-total"></span></span>
                    </div>
                    <div class="goal__bar"><div class="goal__fill" id="goal-fill"></div></div>
                    <p class="goal__resto" id="goal-resto"></p>
                </div>
            </section>

            <section class="kpi-grid">
                <article class="kpi">
                    <span class="kpi__label">Estudiado hoy</span>
                    <span class="kpi__value" id="kpi-hoy">—</span>
                </article>
                <article class="kpi">
                    <span class="kpi__label">Esta semana</span>
                    <span class="kpi__value" id="kpi-semana">—</span>
                </article>
                <article class="kpi">
                    <span class="kpi__label">Racha</span>
                    <span class="kpi__value" id="kpi-racha">—</span>
                </article>
                <article class="kpi">
                    <span class="kpi__label">Sesiones hoy</span>
                    <span class="kpi__value" id="kpi-sesiones">—</span>
                </article>
            </section>

            <div class="inicio-grid">

                <section class="card">
                    <div class="card__header">
                        <h2 class="card__title">Tareas de hoy</h2>
                        <a href="semana.html" class="u-small">Ver la semana</a>
                    </div>
                    <div class="card__body">
                        <ul id="inicio-tareas" class="task-list">
                            <li class="empty-msg">Cargando…</li>
                        </ul>
                    </div>
                </section>

                <section class="card">
                    <div class="card__header">
                        <h2 class="card__title">Próximamente</h2>
                        <a href="calendario.html" class="u-small">Ver calendario</a>
                    </div>
                    <div class="card__body">
                        <ul id="inicio-eventos" class="evento-list">
                            <li class="empty-msg">Cargando…</li>
                        </ul>
                    </div>
                </section>

                <section class="card inicio-grid__wide">
                    <div class="card__header">
                        <h2 class="card__title">Temas a reforzar</h2>
                        <a href="progreso.html" class="u-small">Ver progreso del temario</a>
                    </div>
                    <div class="card__body">
                        <ul id="inicio-recos" class="reco-mini-list">
                            <li class="empty-msg">Cargando…</li>
                        </ul>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/inicio.js"></script>
    <script type="module" src="js/pwa.js"></script>
</body>
</html>
