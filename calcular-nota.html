<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de nota · Planificador CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="display: none;">

    <button id="menu-toggle" aria-label="Abrir menú de navegación">
        <svg class="icon icon--lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav id="main-nav" aria-label="Navegación principal"></nav>

    <main class="content-wrapper calc-layout">
        <div class="page-inner">

            <div id="view-calculator">
                <header class="page-header">
                    <div>
                        <h1 class="page-header__title">Calculadora de nota</h1>
                        <p class="page-header__sub">Corrección con penalización por respuesta incorrecta.</p>
                    </div>
                    <div class="page-header__actions">
                        <div class="calendar-mode-switcher">
                            <button class="mode-btn active" data-mode="teoria">Teoría · 3 opciones</button>
                            <button class="mode-btn" data-mode="psicos">Psicotécnicos · 4 opciones</button>
                        </div>
                    </div>
                </header>

                <section class="card">
                    <div class="card__body">
                        <div class="field">
                            <label class="field__label" for="input-total">Número total de preguntas</label>
                            <input type="number" id="input-total" class="input" placeholder="100" min="1">
                        </div>

                        <div class="field-row">
                            <div class="field">
                                <label class="field__label" for="input-aciertos">Aciertos</label>
                                <input type="number" id="input-aciertos" class="input" placeholder="0" min="0">
                            </div>
                            <div class="field">
                                <label class="field__label" for="input-errores">Errores</label>
                                <input type="number" id="input-errores" class="input" placeholder="0" min="0">
                            </div>
                        </div>

                        <div class="blancas-info">
                            <span class="u-muted">Preguntas en blanco</span>
                            <span id="val-blancas">0</span>
                        </div>

                        <div class="result-box">
                            <span class="result-label">Tu nota</span>
                            <h2 id="final-score">0.000</h2>
                            <span id="score-message" class="score-msg">Introduce tus datos</span>
                        </div>

                        <button id="btn-go-progress" class="btn btn--primary btn--block mt-5">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="15"/></svg>
                            Guardar y ver evolución
                        </button>
                    </div>
                </section>
            </div>

            <div id="view-progress" class="hidden">
                <header class="page-header">
                    <div>
                        <h1 class="page-header__title">Evolución de notas</h1>
                        <p class="page-header__sub">Histórico de tests y exámenes registrados.</p>
                    </div>
                    <div class="page-header__actions">
                        <button id="btn-back-calc" class="btn btn--secondary">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><line x1="12" y1="19" x2="5" y2="12"/><line x1="12" y1="5" x2="5" y2="12"/></svg>
                            Volver a la calculadora
                        </button>
                    </div>
                </header>

                <section class="card mb-6">
                    <div class="card__header">
                        <h2 class="card__title">Registrar nota</h2>
                    </div>
                    <div class="card__body">
                        <div class="add-grade-form">
                            <div class="input-row">
                                <div class="grow-2">
                                    <label class="field__label" for="grade-title">Título</label>
                                    <input type="text" id="grade-title" class="modern-input" placeholder="Test del tema 5">
                                </div>
                                <div class="grow-1">
                                    <label class="field__label" for="grade-score">Nota</label>
                                    <input type="number" id="grade-score" class="modern-input" placeholder="0.000" step="0.001">
                                </div>
                            </div>

                            <div class="input-row">
                                <div class="grow-1">
                                    <label class="field__label" for="grade-tema">Tema</label>
                                    <select id="grade-tema" class="modern-select">
                                        <option value="">Sin tema asociado</option>
                                        <option value="GLOBAL">Examen global (todo el temario)</option>
                                    </select>
                                </div>
                                <div class="grow-1">
                                    <label class="field__label" for="grade-date">Fecha</label>
                                    <input type="date" id="grade-date" class="modern-input date-input">
                                </div>
                            </div>

                            <div class="action-buttons">
                                <button id="btn-save-grade" class="btn btn--primary">
                                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                    Añadir
                                </button>
                                <button id="btn-cancel-edit" class="btn btn--secondary hidden">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </section>

                <p class="section-label">Mostrar en la gráfica</p>
                <div class="chart-filters-modern mb-4">
                    <label class="filter-pill active">
                        <input type="checkbox" value="examen" checked hidden>
                        <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="6"/><polyline points="8.5 14 7.5 22 12 19.5 16.5 22 15.5 14"/></svg>
                        Exámenes
                    </label>
                    <label class="filter-pill active">
                        <input type="checkbox" value="test" checked hidden>
                        <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="15" y1="13" x2="9" y2="13"/><line x1="15" y1="17" x2="9" y2="17"/></svg>
                        Tests
                    </label>
                </div>

                <div class="graph-wrapper-modern mb-6">
                    <canvas id="progressChart"></canvas>
                </div>

                <section class="card">
                    <div class="card__header">
                        <h2 class="card__title">Historial reciente</h2>
                    </div>
                    <div class="card__body">
                        <ul id="grades-list" class="history-list"></ul>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/calcular-nota.js"></script>
</body>
</html>
