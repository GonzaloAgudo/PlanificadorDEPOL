<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Nota CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="display: none;">

    <button id="menu-toggle">☰</button>
    <nav id="main-nav"></nav>

    <main class="content-wrapper">
        
        <div class="calc-container">
            
            <div id="view-calculator">
                <h1>Calculadora CNP 👮‍♂️</h1>

                <div class="calendar-mode-switcher">
                    <button class="mode-btn active" data-mode="teoria">📖 Teoría (3 opc)</button>
                    <button class="mode-btn" data-mode="psicos">🧩 Psicos (4 opc)</button>
                </div>

                <div class="calc-card">
                    <div class="input-group full-width">
                        <label>Nº Total de Preguntas (P)</label>
                        <input type="number" id="input-total" placeholder="Ej: 100" min="1" class="calc-input">
                    </div>

                    <div class="calc-row">
                        <div class="input-group">
                            <label>✅ Aciertos (A)</label>
                            <input type="number" id="input-aciertos" placeholder="0" min="0" class="calc-input">
                        </div>

                        <div class="input-group">
                            <label>❌ Errores (E)</label>
                            <input type="number" id="input-errores" placeholder="0" min="0" class="calc-input">
                        </div>
                    </div>

                    <div class="blancas-info">
                        ⚪ En blanco: <span id="val-blancas">0</span>
                    </div>

                    <hr class="divider">

                    <div class="result-box">
                        <span class="result-label">TU NOTA</span>
                        <h2 id="final-score">0.000</h2>
                        <span id="score-message" class="score-msg">Introduce tus datos</span>
                    </div>

                    <button id="btn-go-progress" class="btn-secondary-outline" style="width:100%; margin-top: 1.5rem;">
                        📈 Guardar y Ver Progreso
                    </button>
                </div>
            </div>

            <div id="view-progress" class="hidden">
                
                <div class="progress-header-modern">
                    <button id="btn-back-calc" class="nav-arrow-modern">←</button>
                    <h2>Evolución</h2> 
                </div>

                <div class="calc-card modern-card">
                    
                    <div class="add-grade-form modern-form">
                        <div class="input-row">
                            <div class="input-with-icon grow-2">
                                <span class="input-icon">📝</span>
                                <input type="text" id="grade-title" placeholder="Título (Ej: Test T5)" class="modern-input">
                            </div>
                            <div class="input-with-icon grow-1">
                                <span class="input-icon">💯</span>
                                <input type="number" id="grade-score" placeholder="Nota" step="0.001" class="modern-input">
                            </div>
                        </div>
                        
                        <div class="input-row bottom-row">
                            <div class="input-with-icon grow-priority">
                                <span class="input-icon">📅</span>
                                <div class="date-wrapper">
                                    <input type="date" id="grade-date" class="modern-input date-input">
                                </div>
                            </div>
                            
                            <div class="action-buttons">
                                <button id="btn-cancel-edit" class="btn-modern-cancel hidden" title="Cancelar">✖</button>
                                <button id="btn-save-grade" class="btn-modern-save">
                                    <span class="btn-icon">+</span> Añadir
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="chart-filters-modern">
                        <label class="filter-pill active">
                            <input type="checkbox" value="examen" checked hidden> 
                            <span>🏆 Exámenes</span>
                        </label>
                        <label class="filter-pill active">
                            <input type="checkbox" value="test" checked hidden> 
                            <span>🧠 Tests</span>
                        </label>
                    </div>

                    <div class="chart-container graph-wrapper-modern">
                        <canvas id="progressChart"></canvas>
                    </div>

                    <div class="history-list-container modern-history">
                        <h3>Historial Reciente</h3>
                        <ul id="grades-list" class="history-list"></ul>
                    </div>
                </div>
            </div>

        </div>
    </main>
    
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/calcular-nota.js"></script>
</body>
</html>
