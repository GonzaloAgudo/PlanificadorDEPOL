<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: none;">

    <button id="menu-toggle">☰</button>
    <nav id="main-nav"></nav>

    <main class="content-wrapper calendario-layout">
        <div class="calendar-container">
            
            <div class="calendar-mode-switcher">
                <button class="mode-btn active" data-mode="clases">📚 Clases</button>
                <button class="mode-btn" data-mode="entrenamientos">🏋️ Entrenamientos</button>
            </div>
            <div class="calendar-header">
                <button id="prev-month-btn" class="nav-arrow">&lt;</button>
                <h1 id="month-year-title">Cargando...</h1>
                <button id="next-month-btn" class="nav-arrow">&gt;</button>
            </div>
            <div class="calendar-grid-header">
                <div>Lunes</div>
                <div>Martes</div>
                <div>Miércoles</div>
                <div>Jueves</div>
                <div>Viernes</div>
                <div>Sábado</div>
                <div>Domingo</div>
            </div>
            <div class="calendar-grid-body" id="calendar-body">
                </div>
        </div>

        <div id="event-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Detalles del Evento</h2>
            
            <div class="modal-form">
                <label>Título del evento</label>
                <input type="text" id="modal-title" placeholder="Ej: Clase T33">
                
                <label>Descripción / Hora</label>
                <textarea id="modal-desc" rows="3" placeholder="Ej: 10:00 - 12:00. Llevar apuntes nuevos."></textarea>
                
                <input type="hidden" id="modal-event-id"> </div>

            <div class="modal-buttons">
                <button id="btn-modal-delete" class="btn-danger">🗑️ Borrar</button>
                <div class="right-btns">
                    <button id="btn-modal-cancel" class="btn-secondary">Cancelar</button>
                    <button id="btn-modal-save" class="btn-primary">💾 Guardar</button>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/colorRules.js"></script>
    <script type="module" src="js/calendario.js"></script>
</body>
</html>
