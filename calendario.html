<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario · Planificador CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#111c29">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Planificador">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: none;">

    <button id="menu-toggle" aria-label="Abrir menú de navegación">
        <svg class="icon icon--lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav id="main-nav" aria-label="Navegación principal"></nav>

    <main class="content-wrapper">
        <div class="page-inner page-inner--wide">

            <header class="page-header">
                <div>
                    <h1 class="page-header__title">Calendario</h1>
                    <p class="page-header__sub">Clases, entrenamientos y días festivos.</p>
                </div>
                <div class="page-header__actions">
                    <div class="calendar-mode-switcher">
                        <button class="mode-btn active" data-mode="clases">Clases</button>
                        <button class="mode-btn" data-mode="entrenamientos">Entrenamientos</button>
                    </div>
                </div>
            </header>

            <div class="calendar-header">
                <button id="prev-month-btn" class="nav-arrow" aria-label="Mes anterior">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <h1 id="month-year-title">Cargando…</h1>
                <button id="next-month-btn" class="nav-arrow" aria-label="Mes siguiente">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <div class="calendar-grid-header">
                <div>Lunes</div>
                <div>Martes</div>
                <div>Miércoles</div>
                <div>Jueves</div>
                <div>Viernes</div>
                <div>Sábado</div>
                <div>Domingo</div>
            </div>
            <div class="calendar-grid-body" id="calendar-body"></div>

        </div>
    </main>

    <div id="event-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Detalles del evento</h2>

            <div class="modal-form">
                <div class="field">
                    <label class="field__label" for="modal-title">Título</label>
                    <input type="text" id="modal-title" class="input" placeholder="Clase del tema 33">
                </div>

                <div class="field">
                    <label class="field__label" for="modal-desc">Descripción u horario</label>
                    <textarea id="modal-desc" class="input" rows="3" placeholder="10:00 – 12:00. Llevar apuntes nuevos."></textarea>
                </div>

                <input type="hidden" id="modal-event-id">
            </div>

            <div class="modal-buttons">
                <button id="btn-modal-delete" class="btn btn--danger-quiet">
                    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Borrar
                </button>
                <div class="right-btns">
                    <button id="btn-modal-cancel" class="btn btn--secondary">Cancelar</button>
                    <button id="btn-modal-save" class="btn btn--primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/colorRules.js"></script>
    <script type="module" src="js/calendario.js"></script>
    <script type="module" src="js/pwa.js"></script>
</body>
</html>
