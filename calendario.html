<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: none;">

    <button id="menu-toggle">☰</button>
    <nav id="main-nav"></nav>

    <main class="content-wrapper calendario-layout">
        <div class="calendar-container">
            <div class="calendar-header">
                <button id="prev-month-btn">&lt;</button>
                <h1 id="month-year-title">Cargando...</h1>
                <button id="next-month-btn">&gt;</button>
            </div>
            <div class="calendar-grid-header">
                <div>Lunes</div>
                <div>Martes</div>
                <div>Miércoles</div>
                <div>Jueves</div>
                <div>Viernes</div>
                <div>Sábado</div>
                <div>Domingo</div>
            </div>
            <div class="calendar-grid-body" id="calendar-body">
                </div>
        </div>
    </main>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/colorRules.js"></script>
    <script type="module" src="js/calendario.js"></script>
    
    <script>
        (function() {
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', function () {
                window.location.replace('index.html');
            });
        })();
    </script>
</body>
</html>
