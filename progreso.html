<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: none;">

    <button id="menu-toggle">☰</button>
    <nav id="main-nav"></nav>

    <main class="content-wrapper progress-layout">
        <div class="progress-container">
            <div class="progress-header">
                <h1>Seguimiento de Temario</h1>
                <button id="add-col-btn" class="btn-secondary-outline" title="Añadir Columna de Checkbox">+ Columna</button>
            </div>

            <div class="reco-panel">
                <div class="reco-header">
                    <h2>🎯 Recomendado reforzar</h2>
                    <button id="btn-ver-ranking" class="btn-secondary-outline">Ver ranking completo</button>
                </div>
                <p class="reco-explicacion">
                    Combina el peso real de cada tema en el examen oficial (2020-2025)
                    con tu tiempo de estudio y tus notas de tests/exámenes por tema.
                </p>
                <div id="reco-cards" class="reco-cards-grid">
                    <p class="empty-msg">Calculando recomendaciones...</p>
                </div>
            </div>

            <div class="table-responsive">
                <table id="progress-table">
                    <thead>
                        <tr id="table-header-row">
                            </tr>
                    </thead>
                    <tbody id="progress-body">
                        </tbody>
                </table>
            </div>
            
            <button id="add-row-btn" class="btn-ghost">+ Nuevo Tema</button>
            <div id="loading-msg">Cargando tu Notion personal...</div>
        </div>
    </main>

    <div id="ranking-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width:640px;">
            <h2>Ranking completo (45 temas)</h2>
            <ul id="ranking-list" class="ranking-list"></ul>
            <div class="modal-buttons" style="justify-content: flex-end;">
                <button id="btn-cerrar-ranking" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/progreso.js"></script>
</body>
</html>
