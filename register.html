<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · Planificador CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <form id="register-form">
            <div class="login-brand">
                <img src="assets/logo.png" alt="">
                <span>
                    <span class="login-brand__name">Planificador</span>
                    <span class="login-brand__sub">Oposición CNP</span>
                </span>
            </div>

            <h2>Crear cuenta</h2>
            <p class="login-intro">La contraseña debe tener al menos 6 caracteres.</p>

            <div class="form-group">
                <label for="username">Correo electrónico</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 6 12 13 2 6"/></svg>
                    </span>
                    <input type="email" id="username" name="username" autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Repetir contraseña</label>
                <div class="input-with-icon">
                    <span class="input-icon">
                        <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                </div>
            </div>

            <p id="error-message"></p>

            <button type="submit">Crear cuenta</button>

            <p class="login-alt">¿Ya tienes cuenta? <a href="login.html">Acceder</a></p>
        </form>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
