<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migración de datos · Planificador CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        main {
            max-width: 820px;
            margin: 0 auto;
            padding: var(--sp-10) var(--sp-5);
        }
        .tabla-migracion { width: 100%; border-collapse: collapse; margin-bottom: var(--sp-5); }
        .tabla-migracion th, .tabla-migracion td {
            text-align: left;
            padding: var(--sp-2) var(--sp-3);
            border-bottom: 1px solid var(--c-border);
            vertical-align: top;
        }
        .tabla-migracion td:last-child, .tabla-migracion th:last-child { text-align: right; width: 110px; }
        #estado { margin-top: var(--sp-4); font-weight: 500; font-size: 0.875rem; }
    </style>
</head>
<body style="display: none;">
    <main>
        <header class="page-header">
            <div>
                <h1 class="page-header__title">Migración de datos</h1>
                <p class="page-header__sub">Pasa tus datos a los nombres nuevos de colecciones y campos.</p>
            </div>
        </header>

        <div class="card">
            <div class="card__body">
                <p class="u-muted u-small">
                    Se copian tus documentos con los nombres nuevos, se comprueba que están
                    guardados y solo entonces se borra la copia antigua. Puedes repetirlo
                    sin miedo: lo ya migrado no se duplica.
                </p>
                <div id="resumen"></div>
                <button id="btn-migrar" class="btn btn--primary" disabled>Migrar mis datos</button>
                <p id="estado"></p>
            </div>
        </div>
    </main>

    <script type="module" src="js/migracion.js"></script>
</body>
</html>
