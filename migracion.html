<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migración de datos · Planificador CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        main {
            max-width: 820px;
            margin: 0 auto;
            padding: var(--sp-10) var(--sp-5);
        }
        #json-data { min-height: 220px; font-family: var(--f-mono); font-size: 0.8125rem; }
        #status { margin-top: var(--sp-4); font-weight: 500; font-size: 0.875rem; }
    </style>
</head>
<body>
    <main>
        <header class="page-header">
            <div>
                <h1 class="page-header__title">Migración de datos</h1>
                <p class="page-header__sub">Herramienta interna para importar datos de MySQL a Firestore.</p>
            </div>
        </header>

        <div class="card">
            <div class="card__body">
                <p class="u-muted u-small">
                    Antes de importar, comprueba que el JSON tiene los <code>user_id</code> actualizados.
                </p>

                <div class="form-group">
                    <label for="collection-name">Colección de destino en Firestore</label>
                    <input type="text" id="collection-name" placeholder="sesiones_estudio, tareas_semanales…">
                </div>

                <div class="form-group">
                    <label for="json-data">Contenido del archivo .json</label>
                    <textarea id="json-data"></textarea>
                </div>

                <button id="migrate-btn" class="btn btn--primary">Migrar datos</button>
                <p id="status"></p>
            </div>
        </div>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/migracion.js"></script>
</body>
</html>
