<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador semanal · Planificador CNP</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: none;">

    <button id="menu-toggle" aria-label="Abrir menú de navegación">
        <svg class="icon icon--lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <nav id="main-nav" aria-label="Navegación principal"></nav>

    <main class="content-wrapper">
        <div class="page-inner page-inner--wide">
            <div class="week-tasks-container">

                <div class="week-header">
                    <button id="prev-week-btn" class="nav-arrow" aria-label="Semana anterior">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>

                    <div class="header-center">
                        <h1 id="week-title">Cargando…</h1>
                        <select id="filter-tasks-select" class="filter-select" aria-label="Filtrar tareas">
                            <option value="all">Todas las tareas</option>
                            <option value="pending">Solo pendientes</option>
                        </select>
                    </div>

                    <button id="next-week-btn" class="nav-arrow" aria-label="Semana siguiente">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                </div>

                <div class="week-grid">

                    <div class="day-column" data-day-id="Lunes" data-date="">
                        <h2>Lunes <span class="day-date"></span></h2>
                        <ul class="task-list"></ul>
                        <div class="task-input-group">
                            <input type="text" placeholder="Nueva tarea…" aria-label="Nueva tarea del lunes">
                            <button data-day="Lunes" aria-label="Añadir tarea">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="day-column" data-day-id="Martes" data-date="">
                        <h2>Martes <span class="day-date"></span></h2>
                        <ul class="task-list"></ul>
                        <div class="task-input-group">
                            <input type="text" placeholder="Nueva tarea…" aria-label="Nueva tarea del martes">
                            <button data-day="Martes" aria-label="Añadir tarea">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="day-column" data-day-id="Miércoles" data-date="">
                        <h2>Miércoles <span class="day-date"></span></h2>
                        <ul class="task-list"></ul>
                        <div class="task-input-group">
                            <input type="text" placeholder="Nueva tarea…" aria-label="Nueva tarea del miércoles">
                            <button data-day="Miércoles" aria-label="Añadir tarea">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="day-column" data-day-id="Jueves" data-date="">
                        <h2>Jueves <span class="day-date"></span></h2>
                        <ul class="task-list"></ul>
                        <div class="task-input-group">
                            <input type="text" placeholder="Nueva tarea…" aria-label="Nueva tarea del jueves">
                            <button data-day="Jueves" aria-label="Añadir tarea">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="day-column" data-day-id="Viernes" data-date="">
                        <h2>Viernes <span class="day-date"></span></h2>
                        <ul class="task-list"></ul>
                        <div class="task-input-group">
                            <input type="text" placeholder="Nueva tarea…" aria-label="Nueva tarea del viernes">
                            <button data-day="Viernes" aria-label="Añadir tarea">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="day-column" data-day-id="Sábado" data-date="">
                        <h2>Sábado <span class="day-date"></span></h2>
                        <ul class="task-list"></ul>
                        <div class="task-input-group">
                            <input type="text" placeholder="Nueva tarea…" aria-label="Nueva tarea del sábado">
                            <button data-day="Sábado" aria-label="Añadir tarea">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="day-column" data-day-id="Domingo" data-date="">
                        <h2>Domingo <span class="day-date"></span></h2>
                        <ul class="task-list"></ul>
                        <div class="task-input-group">
                            <input type="text" placeholder="Nueva tarea…" aria-label="Nueva tarea del domingo">
                            <button data-day="Domingo" aria-label="Añadir tarea">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/colorRules.js"></script>
    <script type="module" src="js/semana.js"></script>
</body>
</html>
