<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes</title>
    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body style="display: none;">

    <button id="menu-toggle">☰</button>
    <nav id="main-nav">
        <ul>
            <li><a href="index.html">Pomodoro</a></li>
            <li><a href="stats.html">Estadísticas</a></li>
            <li><a href="semana.html">Planificador Semanal</a></li>
            <li><a href="calendario.html">Calendario</a></li>
            <li><a href="ajustes.html" class="active">Ajustes</a></li> 
            <li><a href="logout.php" class="logout-link">Cerrar Sesión</a></li>
        </ul>
    </nav>

    <main class="content-wrapper settings-layout">
        <div class="settings-container">
            <h1>Ajustes</h1>

            <div id="settings-menu" class="settings-card">
                
                <div class="settings-menu-grid">
                    <button class="settings-nav-btn" data-target="section-rules">
                        <span class="icon">🎨</span> Reglas de Colores ›
                    </button>
                    
                    <button class="settings-nav-btn" data-target="section-history">
                        <span class="icon">📝</span> Historial de Sesiones ›
                    </button>
                </div>

                <div class="settings-menu-grid">
                    <button id="btn-delete-account" class="settings-nav-btn danger">
                        <span class="icon">🗑️</span> Eliminar Cuenta
                    </button>
                </div>

            </div>

            <div id="section-rules" class="settings-section" style="display: none;">
                <button class="back-btn">← Volver</button>
                
                <form id="rule-form" class="settings-card">
                    <h2 id="form-title">Añadir Nueva Regla</h2>
                    <input type="hidden" id="rule-id-input">
                    
                    <div class="form-group">
                        <label>Palabra clave</label>
                        <input type="text" id="keyword-input" placeholder="Ej: clase, test..." required>
                    </div>
                    
                    <div class="form-group">
                        <label>Color</label>
                        <div class="color-palette" id="color-palette"></div>
                        <input type="hidden" id="bg-color-input">
                        <input type="hidden" id="border-color-input">
                    </div>
                    
                    <div class="form-buttons">
                        <button type="submit" id="save-rule-btn">Guardar</button>
                        <button type="button" id="cancel-edit-btn" style="display: none;">Cancelar</button>
                    </div>
                </form>

                <div class="settings-card">
                    <h2>Mis Reglas</h2>
                    <ul id="rules-list"></ul>
                </div>
            </div>

            <div id="section-history" class="settings-section" style="display: none;">
                <button class="back-btn">← Volver</button>
                
                <form id="session-form" class="settings-card" style="display: none; border: 2px solid var(--color-primario);">
                    <h2 style="color: var(--color-primario);">✏️ Editando Sesión</h2>
                    <input type="hidden" id="session-id-input">
                    
                    <div class="config-grid">
                        <div class="form-group">
                            <label>Fecha y Hora</label>
                            <input type="datetime-local" id="session-date-input" required>
                        </div>
                        <div class="form-group">
                            <label>Minutos</label>
                            <input type="number" id="session-duration-input" required>
                        </div>
                    </div>

                    <div class="config-grid">
                        <div class="form-group">
                            <label>Tipo</label>
                            <select id="session-type-input">
                                <option value="estudio">Estudio</option>
                                <option value="clase">Clase</option>
                                <option value="psicotecnicos">Psicotécnicos</option>
                                <option value="test">Test</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tema</label>
                            <input type="text" id="session-topic-input">
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" id="save-session-btn">Guardar Cambios</button>
                        <button type="button" id="cancel-session-btn">Cancelar</button>
                    </div>
                </form>

                <div class="settings-card">
                    <h2>Historial de Sesiones</h2>
                    <ul id="sessions-list" class="history-list"></ul>
                    <button id="load-more-sessions" class="btn-secondary-outline" style="width:100%; margin-top:1rem; display:none;">Ver más antiguas</button>
                </div>
            </div>

        </div>
    </main>

    <script type="module" src="js/auth-guard.js"></script>
    <script type="module" src="js/nav.js"></script>
    <script type="module" src="js/colorRules.js"></script> 
    <script type="module" src="js/ajustes.js"></script> 
</body>
</html>
